name: Build & Upload to TestFlight

on:
  push:
    branches: [main, claude/reduce-memory-usage-BwFrG, claude/review-project-structure-YAZJR]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Upload
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          eval "$(/opt/homebrew/bin/brew shellenv)"

          # Materialize ASC API key from GitHub secret → disposable file
          # under RUNNER_TEMP so each run gets a fresh copy and cleanup
          # wipes it. xcodebuild requires an absolute path to an existing
          # file for -authenticationKeyPath, and we don't want the .p8
          # permanently stored on the runner.
          echo "=== ASC key materialization ==="
          echo "ASC_KEY_BASE64 length: ${#ASC_KEY_BASE64}"
          echo "ASC_KEY_ID set: $([ -n "$ASC_KEY_ID" ] && echo yes || echo no)"
          echo "ASC_ISSUER_ID set: $([ -n "$ASC_ISSUER_ID" ] && echo yes || echo no)"
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "ASC_KEY_BASE64 secret is empty" >&2
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ]; then
            echo "ASC_KEY_ID secret is empty" >&2
            exit 1
          fi

          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$RUNNER_TEMP"
          # openssl base64 is on every mac; -A folds newlines, -d decodes.
          # Strip possible whitespace/newlines in the secret value first.
          printf '%s' "$ASC_KEY_BASE64" | tr -d '[:space:]' | openssl base64 -d -A > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          KEY_SIZE=$(wc -c < "$ASC_KEY_PATH" | tr -d ' ')
          echo "Decoded .p8 size: ${KEY_SIZE} bytes"
          if [ "$KEY_SIZE" -lt 100 ]; then
            echo "Decoded key is suspiciously small — secret likely malformed" >&2
            head -c 200 "$ASC_KEY_PATH"
            echo
            exit 1
          fi
          head -1 "$ASC_KEY_PATH"

          # Keychain setup. KEYCHAIN_PASSWORD secret predates the move to
          # Mac-mini-GK and may hold the old runner's password; fall back to
          # this runner's known login password if the secret is rejected.
          echo "=== Keychain unlock ==="
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain 2>&1
          KC_PW="$KEYCHAIN_PASSWORD"
          if ! security unlock-keychain -p "$KC_PW" ~/Library/Keychains/login.keychain-db 2>&1; then
            echo "unlock with KEYCHAIN_PASSWORD secret failed; trying runner default"
            KC_PW='123qwe'
            security unlock-keychain -p "$KC_PW" ~/Library/Keychains/login.keychain-db 2>&1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" ~/Library/Keychains/login.keychain-db >/dev/null 2>&1 || true
          security set-keychain-settings -lut 21600 ~/Library/Keychains/login.keychain-db 2>&1
          echo "=== Signing identities ==="
          security find-identity -v -p codesigning 2>&1

          # Regenerate project.pbxproj from project.yml so new source files
          # dropped into the source group directories are picked up on every
          # build (XcodeGen source group: type=group).
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen not found on runner; install via 'brew install xcodegen'"
            exit 1
          fi
          xcodegen generate --spec project.yml

          # Archive
          xcodebuild -scheme AntiDPIVPN \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/AntiDPIVPN.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=WJWU38ALPB

          # Create ExportOptions
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EXPORTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>uploadSymbols</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>WJWU38ALPB</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.truvvor.secureconnect</key>
              <string>SecureConnect AppStore</string>
              <key>com.truvvor.secureconnect.tunnel</key>
              <string>SecureConnect Tunnel AppStore</string>
            </dict>
          </dict>
          </plist>
          EXPORTEOF

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AntiDPIVPN.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

          # Upload to TestFlight
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/AntiDPIVPN.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          # Stage dSYMs + app binary for artifact upload BEFORE cleanup
          mkdir -p "$RUNNER_TEMP/debug_symbols"
          cp -R "$RUNNER_TEMP/AntiDPIVPN.xcarchive/dSYMs" "$RUNNER_TEMP/debug_symbols/" 2>/dev/null || true
          cp "$RUNNER_TEMP/AntiDPIVPN.xcarchive/Products/Applications/AntiDPIVPN.app/AntiDPIVPN" \
             "$RUNNER_TEMP/debug_symbols/AntiDPIVPN.bin" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/debug_symbols/"

      - name: Upload dSYMs + binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-and-binary
          path: ${{ runner.temp }}/debug_symbols
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -rf ${{ runner.temp }}/AntiDPIVPN.xcarchive
          rm -rf ${{ runner.temp }}/export
          rm -f ${{ runner.temp }}/ExportOptions.plist
          rm -f ${{ runner.temp }}/AuthKey_*.p8
